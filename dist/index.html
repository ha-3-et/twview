<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="ローカルでX投稿アーカイブを閲覧・検索・整理するビューア" />
    <script>
      (() => {
        try {
          const settings = JSON.parse(localStorage.getItem('x-archive-settings') || '{}')
          const savedTheme = settings.theme || 'system'
          const theme = savedTheme === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : savedTheme
          const font = settings.font === 'system' ? 'system' : 'noto'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.font = font
          document.documentElement.style.colorScheme = theme
        } catch {
          const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
      })()
    </script>
    <style>#app-startup-loader{z-index:9999;background:#eef3f4;place-items:center;transition:opacity .15s,visibility .15s;display:grid;position:fixed;inset:0}:root[data-theme=dark] #app-startup-loader{background:#000}#app-startup-loader.is-hidden{opacity:0;visibility:hidden}#app-startup-loader:before{content:"";border:3px solid #d7ecfb;border-top-color:#1d9bf0;border-radius:50%;width:30px;height:30px;animation:.82s linear infinite startup-spin}:root[data-theme=dark] #app-startup-loader:before{border-color:#1d9bf0 #0b2336 #0b2336}@keyframes startup-spin{to{transform:rotate(360deg)}}</style>
