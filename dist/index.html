    <script>
      (() => {
        try {
          const settings = JSON.parse(localStorage.getItem('x-archive-settings') || '{}')
          const savedTheme = settings.theme || 'system'
          const theme = savedTheme === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : savedTheme
          const font = settings.font === 'system' ? 'system' : 'noto'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.font = font
          document.documentElement.style.colorScheme = theme
        } catch {
          const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
      })()
    </script>
    <!-- GA4: VITE_GA_MEASUREMENT_ID が設定されたビルドでのみ有効になります。 -->

      window.dataLayer = window.dataLayer || []
      window.gtag = function () { window.dataLayer.push(arguments) }

      if (/^G-[A-Z0-9]+$/.test(gaMeasurementId)) {
        window.gtag('js', new Date())
        window.gtag('config', gaMeasurementId, { send_page_view: true })
        const gaScript = document.createElement('script')
        gaScript.async = true
        gaScript.src = `https://www.googletagmanager.com/gtag/js?id=${gaMeasurementId}`
        document.head.appendChild(gaScript)
      }
    </script>
