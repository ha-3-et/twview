<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="ローカルでX投稿アーカイブを閲覧・検索・整理するビューア" />
    <script>
      (() => {
        try {
          const settings = JSON.parse(localStorage.getItem('x-archive-settings') || '{}')
          const savedTheme = settings.theme || 'system'
          const theme = savedTheme === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : savedTheme
          const font = settings.font === 'system' ? 'system' : 'noto'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.font = font
          document.documentElement.style.colorScheme = theme
        } catch {
          const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
      })()
    </script>
    <style>
      #app-startup-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #eef3f4;
        transition: opacity 0.15s ease, visibility 0.15s ease;
      }
      :root[data-theme="dark"] #app-startup-loader {
        background: #000;
      }
      #app-startup-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      #app-startup-loader::before {
        content: "";
        width: 30px;
        height: 30px;
        border: 3px solid #d7ecfb;
        border-top-color: #1d9bf0;
        border-radius: 50%;
        animation: startup-spin 0.82s linear infinite;
      }
      :root[data-theme="dark"] #app-startup-loader::before {
        border-color: #0b2336;
        border-top-color: #1d9bf0;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="icon" href="%BASE_URL%assets/logo/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%assets/logo/favicon/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/logo/favicon/icon-32x32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/logo/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>ついびゅ</title>
  </head>
  <body>
    <div id="app-startup-loader" aria-label="読み込み中"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
